# One command to a rules reference on the table:
#
#     docker compose up
#
# then open http://localhost:8765. First run pulls ~6.3 GB of models and a 143 MB
# index into named volumes; later runs start in seconds.
#
# GPU is optional. Without one Ollama runs on CPU, which works and is slower --
# fine for looking things up, noticeable when you press Ask.

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    # Uncomment to use an NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  pf2e:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - pf2e-index:/data
    environment:
      OLLAMA_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama-models:
  pf2e-index:
