[project]
name = "kleverkobold"
version = "0.1.0"
description = "The Klever Kobold: a Pathfinder 2e rules reference that runs on your own machine -- corpus, retrieval, benchmark, fine-tune."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Richard Polzin" }]
# The runtime, and nothing else. Ollama holds the models over HTTP, so there is
# no torch, no transformers and no CUDA anywhere in this graph. Everything needed
# to *build* a corpus or train something lives in an extra.
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "orjson>=3.10",
]

[project.scripts]
kobold = "kleverkobold.__main__:main"

[project.optional-dependencies]
corpus = [
    "tqdm>=4.66",
    "mwparserfromhell>=0.6",
    "python-slugify>=8.0",
    "huggingface_hub>=0.26",
    "hf_transfer>=0.1",
]
# Local inference on Blackwell (sm_120): torch must be a cu128-or-newer build and
# bitsandbytes >=0.45 for 4-bit on this architecture.
local = [
    "torch>=2.7",
    "transformers>=4.57",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "huggingface_hub>=0.26",
    "hf_transfer>=0.1",
]
# 41k chunks is small enough that brute-force cosine over a numpy matrix beats
# carrying a vector database; the whole index is ~60 MB.
retrieval = [
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
]
train = [
    "peft>=0.14",
    "trl>=0.12",
    "datasets>=3.0",
]

[dependency-groups]
# What the test suite and CI need. `uv sync --group dev`, then `uv run pytest`.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mwparserfromhell>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["kleverkobold"]

[tool.coverage.report]
show_missing = false
precision = 0

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kleverkobold"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The defaults plus import order, modern syntax, bugbear, and the simplifiers.
# CI runs `ruff check .` with exactly this, so a local run means the same thing.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",   # the prose uses real dashes and ellipses on purpose
    "RUF012",                       # mutable class attributes are the pattern here
    "B008",                         # default arguments computed once are intended
]

[tool.ruff.lint.pycodestyle]
# 100 is the style; a line is an error at 120. The page (one string) and the
# verbatim model replies in the scorer's tests are exempt below.
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"src/kleverkobold/ui.py" = ["E501"]
"eval/test_score.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["kleverkobold"]
