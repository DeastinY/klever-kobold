[project]
name = "pf2etune"
version = "0.1.0"
description = "Adapting an open-weight LLM to Pathfinder 2e rules and lore: corpus, retrieval, benchmark, fine-tune."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "orjson>=3.10",
    "tqdm>=4.66",
    "mwparserfromhell>=0.6",
    "python-slugify>=8.0",
]

[project.optional-dependencies]
# Local inference on Blackwell (sm_120): torch must be a cu128-or-newer build and
# bitsandbytes >=0.45 for 4-bit on this architecture.
local = [
    "torch>=2.7",
    "transformers>=4.57",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "huggingface_hub>=0.26",
    "hf_transfer>=0.1",
]
# 41k chunks is small enough that brute-force cosine over a numpy matrix beats
# carrying a vector database; the whole index is ~60 MB.
retrieval = [
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
]
train = [
    "peft>=0.14",
    "trl>=0.12",
    "datasets>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pf2etune"]

[tool.ruff]
line-length = 100
