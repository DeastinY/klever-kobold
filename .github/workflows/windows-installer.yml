name: Windows installer

# KleverKoboldSetup.exe: the frozen `kobold` command plus Ollama's installer,
# wrapped by Inno Setup (deploy/windows/). Run by hand for an artifact, or by a
# `v*` tag, which attaches it to that tag's release.

on:
  workflow_dispatch:
    inputs:
      bundle_ollama:
        description: "Embed OllamaSetup.exe (about 1.6 GB) instead of downloading it during install"
        type: boolean
        default: false
      end_to_end:
        description: "After installing on the runner, also pull the models and the index and run doctor (adds ~20 min)"
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/windows-installer.yml"
      - "deploy/windows/**"
      - "src/kleverkobold/update.py"
      - "src/kleverkobold/__main__.py"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Name this build
        # A tag names the version; otherwise the date and the short commit. The
        # frozen program reads build_info.json to know what it is and to say
        # when main has moved on (see update.py).
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"
          else version="$(date -u +%Y.%m.%d)+${GITHUB_SHA::7}"; fi
          printf '{"commit": "%s", "version": "%s", "date": "%s"}\n' \
            "$GITHUB_SHA" "$version" "$(date -u +%Y-%m-%d)" > src/kleverkobold/build_info.json
          echo "VERSION=$version" >> "$GITHUB_ENV"
          cat src/kleverkobold/build_info.json

      - name: Freeze
        run: |
          uv sync
          uv run --with pyinstaller pyinstaller --noconfirm deploy/windows/kobold.spec

      - name: Smoke test the frozen program
        run: |
          dist\kobold\kobold.exe --help
          dist\kobold\kobold.exe upgrade --check; if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          dist\kobold\kobold.exe doctor; if ($LASTEXITCODE -ne 1) { exit 1 }   # no index, no Ollama: says so and exits 1
          exit 0   # the step otherwise takes the last command's exit code, and that 1 was the point

      - name: Ollama's installer, to embed
        if: inputs.bundle_ollama
        run: curl.exe -fsSL -o deploy\windows\OllamaSetup.exe https://ollama.com/download/OllamaSetup.exe

      - name: Installer
        run: |
          choco install innosetup --no-progress -y
          $define = if ('${{ inputs.bundle_ollama }}' -eq 'true') { '/DBundleOllama' } else { '' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" $define deploy\windows\kobold.iss
          Get-Item dist\KleverKoboldSetup.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: KleverKoboldSetup
          path: dist/KleverKoboldSetup.exe

      - name: Install it on this runner
        # A silent install downloads Ollama's installer and runs it, like the
        # wizard would; the checks are what a user would find afterwards.
        run: |
          Start-Process -Wait -FilePath dist\KleverKoboldSetup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install.log'
          Get-Content install.log | Select-Object -Last 30
          $app = "$env:LOCALAPPDATA\Programs\KleverKobold"
          if (-not (Test-Path "$app\kobold.exe")) { Write-Error "kobold.exe is not where the installer puts it"; exit 1 }
          & "$app\kobold.exe" --help | Select-Object -First 1; if ($LASTEXITCODE) { exit 1 }
          $ollama = "$env:LOCALAPPDATA\Programs\Ollama\ollama.exe"
          if (-not (Test-Path $ollama)) { Write-Error "Ollama was not installed alongside"; exit 1 }
          & $ollama --version
          $path = (Get-ItemProperty -Path HKCU:\Environment -Name Path).Path
          if ($path -notlike "*KleverKobold*") { Write-Error "kobold is not on the user's PATH"; exit 1 }
          "installed: $app, Ollama alongside, on PATH" >> $env:GITHUB_STEP_SUMMARY

      - name: Setup and doctor, end to end
        if: inputs.end_to_end
        timeout-minutes: 45
        run: |
          $app = "$env:LOCALAPPDATA\Programs\KleverKobold"
          & "$app\kobold.exe" setup; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$app\kobold.exe" doctor; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "setup and doctor passed on the runner" >> $env:GITHUB_STEP_SUMMARY

      - name: Uninstall it again
        run: |
          $app = "$env:LOCALAPPDATA\Programs\KleverKobold"
          Start-Process -Wait -FilePath "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          if (Test-Path "$app\kobold.exe") { Write-Error "kobold.exe survived the uninstall"; exit 1 }
          $path = (Get-ItemProperty -Path HKCU:\Environment -Name Path).Path
          if ($path -like "*KleverKobold*") { Write-Error "PATH still names KleverKobold after uninstall"; exit 1 }

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/KleverKoboldSetup.exe --clobber
